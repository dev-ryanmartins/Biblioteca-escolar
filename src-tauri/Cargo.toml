[package]
name = "biblioteca-escolar"
version = "0.1.0"
description = "Sistema de Controle de Biblioteca Escolar"
authors = []
license = ""
repository = ""
default-run = "biblioteca-escolar"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "1.5.3", features = [] }

[dependencies]
tauri = { version = "1.7.2", features = [
  "dialog-open",
  "dialog-save",
  "fs-all",
  "path-all",
  "shell-open"
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.31.0", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
csv = "1.3"

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.dev]
incremental = true

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
